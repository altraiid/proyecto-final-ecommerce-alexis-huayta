        <section id="Contacto">
            <h2>Contacto</h2>

            <form id="form" action="https://formspree.io/f/maeqyggk" method="post">
                <fieldset>
                    <p>
                        <label for="">Nombre y Apellido</label>
                        <input type="text" name="nomApe" id="nomApe" placeholder="Pati Sanchez" minlength="3"
                            maxlength="60" required></input>
                    </p>

                    <p>
                        <label for="">Email</label>
                        <input type="email" id="email" name="email" placeholder="nombre@mail.com" minlength="3"
                            maxlength="60" required></input>
                    </p>

                    <p>
                        <label for="">Teléfono</label>
                        <input type="tel" id="tel" name="tel" placeholder="XX-XXXX-XXXX" minlength="3" maxlength="60"
                            required></input>
                    </p>

                    <p>
                        <label for="">Fecha de Nacimiento</label>
                        <input type="date" id="fnac" name="fnac" minlength="3" maxlength="60" required></input>
                    </p>
                    <p>
                        <label for="message">Consulta</label>
                        <textarea name="message" id="message" placeholder="Escriba su consulta"></textarea>
                    </p>
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpiar</button>
                </fieldset>
            </form>
        </section>
